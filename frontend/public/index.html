<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta property="og:title" content="Jay Patel" />
  <meta property="og:description" content="Jay Patel's Portfolio" />
  <meta property="og:image"content="%PUBLIC_URL%/Jay.png" />
  <meta property="og:type"content="website" />
  <meta name="description" content="Jay Patel's Portfolio" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('portfolio_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
